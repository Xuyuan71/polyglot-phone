name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site with Pl@ntNet key from repository secret
        env:
          PLANTNET_KEY: ${{ secrets.PLANTNET_KEY }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp manifest.webmanifest _site/
          if [ -n "$PLANTNET_KEY" ]; then
            sed -i "s/__PLANTNET_KEY__/${PLANTNET_KEY}/" _site/index.html
          else
            echo "PLANTNET_KEY secret not set: scanning will ask users for a key"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build home-screen icons from the Polyglot Asian Medicines leaf icon
        continue-on-error: true
        run: |
          mkdir -p _site/icons
          curl -fsSL --retry 3 "https://static.wixstatic.com/media/589fdb_c5b4674b3f2b4dd0b91ed3579701fe54%7Emv2.png" -o src-icon.png
          python3 -m pip install --quiet pillow
          python3 scripts/make_icons.py src-icon.png _site/icons
          curl -fsSL --retry 3 "https://static.wixstatic.com/media/501c0d_d43a9465ebf34ffea83401a058cd7474%7Emv2.png" -o leaf-white-src.png
          python3 -c "from PIL import Image; im=Image.open('leaf-white-src.png').convert('RGBA'); im.thumbnail((120,120), Image.LANCZOS); im.save('_site/icons/leaf-white.png', optimize=True)"
          ls -l _site/icons
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
